<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zapmaster Session Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/patternomaly@1.3.2/dist/patternomaly.js"></script>
<style>
:root{
  --primary:#2F4F4F;
  --primary-dk:#223a3a;
  --primary-lt:#3d6666;
  --accent:#5f8787;
  --accent-lt:#a7c4c4;
  --bg:#f2f5f5;
  --surface:#ffffff;
  --border:#d5dede;
  --text:#1a2424;
  --muted:#647070;
  --warn-bg:#fff8e1;
  --warn-border:#e0b400;
  --warn-text:#7a5900;
  --positive:#1f7a4d;
  --positive-bg:#e7f4ec;
  --negative:#b23b2e;
  --negative-bg:#fbeeec;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;background:var(--bg);color:var(--text);min-width:768px}
a{color:var(--primary-lt)}
/* APP BAR */
#appbar{background:var(--primary);color:#eaf3f3;position:sticky;top:0;z-index:200;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.bar-top{display:flex;align-items:center;justify-content:space-between;padding:9px 18px;gap:12px;flex-wrap:wrap}
.brand{font-size:16px;font-weight:700;letter-spacing:.3px;display:flex;align-items:baseline;gap:10px}
.brand .bolt{color:var(--warn-border);font-size:18px}
.brand .who{font-size:12px;font-weight:500;color:var(--accent-lt)}
.bar-tools{display:flex;gap:6px;flex-wrap:wrap}
.tbtn{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);border-radius:5px;color:#eaf3f3;padding:5px 11px;font-size:12px;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.22)}
.dropdown{position:relative;display:inline-block}
.dd-menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.18);min-width:110px;padding:4px;display:none;z-index:300}
.dd-menu.open{display:block}
.dd-menu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:7px 11px;font-size:13px;font-weight:500;cursor:pointer;border-radius:4px}
.dd-menu button:hover{background:var(--bg)}
nav#tabs{display:flex;justify-content:space-between;align-items:stretch;padding:0 12px}
.tabs-primary,.tabs-secondary{display:flex;gap:2px}
.tabs-secondary{border-left:1px solid rgba(255,255,255,.15);padding-left:10px;margin-left:8px}
nav#tabs button{background:transparent;border:none;border-bottom:3px solid transparent;color:var(--accent-lt);padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer}
nav#tabs button:hover{color:#fff}
nav#tabs button.active{color:#fff;border-bottom-color:var(--warn-border)}
/* MAIN */
#main{max-width:1180px;margin:0 auto;padding:18px}
.view{display:none}
.view.active{display:block}
/* PANEL */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:16px}
.ph{padding:11px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700;color:var(--primary-dk);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pb{padding:16px}
.page-title{font-size:20px;font-weight:700;color:var(--primary-dk);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* FORM */
.frow{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end}
.fg{display:flex;flex-direction:column;gap:5px;min-width:130px}
.fg.wide{min-width:220px;flex:1}
.fg.full{flex-basis:100%}
.fg.xs{min-width:80px;max-width:110px}
label,.flabel{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{border:1px solid var(--border);border-radius:5px;padding:7px 9px;font-size:13px;background:var(--surface);color:var(--text);width:100%;font-family:inherit}
.pw-wrap{display:flex;gap:6px;align-items:center}
.pw-wrap input{flex:1;min-width:0}
.pw-toggle{flex-shrink:0;padding:6px 10px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.pw-toggle:hover{filter:brightness(1.07)}
textarea{resize:vertical;min-height:64px}
textarea.autogrow{overflow:hidden;resize:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.hint{font-size:11px;color:var(--muted)}
.cbgrid{display:flex;flex-wrap:wrap;gap:6px 16px}
.cbgrid.tight{gap:5px 12px}
.cbitem{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text);white-space:nowrap}
.cbitem input{width:15px;height:15px;accent-color:var(--primary)}
.mod-row{display:flex;align-items:center;gap:10px;padding:5px 0}
.mod-row label{flex:1;text-transform:none;letter-spacing:0;font-weight:500;color:var(--text);font-size:13px}
.mod-row input{width:76px}
.mod-total{margin-top:8px;font-weight:700;color:var(--primary-dk)}
/* BUTTONS */
.btn{padding:7px 15px;border-radius:5px;border:none;cursor:pointer;font-size:13px;font-weight:600}
.btn:hover{filter:brightness(1.07)}
.btn-p{background:var(--primary);color:#fff}
.btn-a{background:var(--accent);color:#fff}
.btn-g{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-d{background:var(--negative);color:#fff}
.btn-sm{padding:4px 10px;font-size:12px}
/* TABLE */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--bg);padding:8px 10px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);border-bottom:2px solid var(--border);white-space:nowrap}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover td{background:#fafcfc}
.tbl .total-row td{font-weight:700;background:var(--bg);border-top:2px solid var(--border)}
.tbl-num td:not(:first-child),.tbl-num th:not(:first-child){text-align:right}
.pill{display:inline-block;padding:2px 9px;border-radius:11px;font-size:11px;font-weight:700}
.pill-consult{background:#eef1f4;color:#4a5568}
.pill-service{background:var(--positive-bg);color:var(--positive)}
.pill-self{background:#eef3f3;color:var(--primary-lt)}
.pill-colleague{background:var(--warn-bg);color:var(--warn-text)}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl th.sortable:hover{color:var(--primary-dk)}
.sort-ind{margin-left:4px;color:var(--accent);font-size:9px}
.tick{color:var(--positive);font-weight:700}
.cross{color:var(--muted)}
.empty{color:var(--muted);font-style:italic;padding:14px 0;text-align:center}
/* DASHBOARD CARDS */
.dgrid{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.dcard{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;flex:1;min-width:150px}
.dcard-link{cursor:pointer}
.dcard-link:hover{border-color:var(--primary)}
.dcard-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:5px}
.dcard-val{font-size:22px;font-weight:800;color:var(--primary)}
.dcard-val.warn{color:var(--warn-text)}
.dcard-sub{font-size:11px;color:var(--muted);margin-top:3px}
.dcard-sub.warn{color:var(--warn-text)}
/* CHARTS */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.chart-box{border:1px solid var(--border);border-radius:8px;padding:12px}
.chart-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:8px;text-align:center}
.prop-toggle{display:inline-flex}
.prop-toggle button{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;padding:3px 10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer}
.prop-toggle button:first-child{border-radius:5px 0 0 5px}
.prop-toggle button:last-child{border-radius:0 5px 5px 0;border-left:none}
.prop-toggle button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.ot-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:11px 13px;border:1px solid var(--warn-border);background:var(--warn-bg);border-radius:8px;margin-bottom:10px}
.ot-row:last-child{margin-bottom:0}
.ot-title{font-weight:700;color:var(--text)}
.ot-sub{font-size:12px;color:var(--muted);margin-top:2px}
.ot-clear{color:var(--positive);font-weight:600}
.num-badge{display:inline-block;min-width:18px;text-align:center;font-size:10px;font-weight:800;color:var(--primary);background:var(--accent-lt);border-radius:4px;padding:1px 5px}
.mod-line{display:flex;align-items:center;gap:6px;white-space:nowrap;padding:1px 0}
.soap-flag{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn-text);font-size:11px;font-weight:800;line-height:1}
.soap-btn{background:none;border:0;padding:2px;cursor:pointer;line-height:1;border-radius:5px}
.soap-btn:hover{background:var(--accent-lt)}
.chart-wrap{position:relative;height:260px}
/* WARN BANNER */
.warn{background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:6px;padding:10px 13px;font-size:13px;color:var(--warn-text);margin-bottom:14px}
/* CALENDAR */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.cal-title{font-size:17px;font-weight:700;color:var(--primary-dk)}
.cal-nav{display:flex;gap:6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:center;padding:4px 0}
.cal-cell{min-height:92px;border:1px solid var(--border);border-radius:7px;padding:6px;position:relative;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:box-shadow .12s}
.cal-cell:hover{box-shadow:0 0 0 2px var(--accent) inset}
.cal-cell.out{background:transparent;border-color:transparent;cursor:default;pointer-events:none}
.cal-daynum-row{display:flex;align-items:center;gap:4px}
.cal-daynum{font-size:13px;font-weight:700;color:var(--text)}
.cal-cell.today .cal-daynum{background:var(--primary);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.cal-badges{display:flex;flex-direction:column;gap:2px;margin-top:auto}
.cbadge{font-size:10px;font-weight:600;color:var(--muted)}
.cbadge b{color:var(--primary-dk)}
.cproc{font-size:10px;font-weight:800;color:var(--primary);background:var(--accent-lt);border-radius:4px;padding:1px 5px;align-self:flex-start}
.cnote{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.csoap{display:inline-flex;align-items:center;justify-content:center;font-size:16px;line-height:1}
/* day types */
.dt-weekend{background:#eef1f1}
.dt-school{background:#fff;border-top:3px solid var(--accent-lt)}
.dt-completed{background:var(--positive-bg);border-top:3px solid var(--positive)}
.dt-planned{background:var(--warn-bg);border:1px solid var(--warn-border);border-top:3px solid var(--warn-border)}
.dt-in{background:#fff;border:1px dashed var(--accent);border-top:3px solid var(--accent)}
.dt-out{background:repeating-linear-gradient(45deg,#f0f2f2,#f0f2f2 6px,#e6eaea 6px,#e6eaea 12px);color:var(--muted)}
.dt-partial{background:var(--positive-bg);border-top:3px solid var(--positive)}
.cwarn{margin-left:4px}
#legend-tip{position:fixed;z-index:600;pointer-events:none;background:rgba(20,30,30,.92);color:#fff;font-size:11px;font-weight:600;padding:4px 8px;border-radius:5px;white-space:nowrap;display:none}
.cal-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;font-size:11px;color:var(--muted)}
.leg{display:flex;align-items:center;gap:6px}
.leg .sw{width:16px;height:16px;border-radius:4px;border:1px solid var(--border)}
/* MODAL */
#modal-root:empty{display:none}
.overlay{position:fixed;inset:0;background:rgba(20,30,30,.5);display:flex;align-items:flex-start;justify-content:center;padding:26px 14px;overflow-y:auto;z-index:500}
.modal{background:var(--surface);border-radius:10px;width:100%;max-width:780px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal.sm{max-width:460px}
.modal-head{padding:14px 18px;border-bottom:1px solid var(--border);font-size:16px;font-weight:700;color:var(--primary-dk);display:flex;align-items:center;justify-content:space-between}
.modal-head .x{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}
.modal-body{padding:18px}
.modal-foot{padding:13px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.section-sep{border:none;border-top:1px solid var(--border);margin:16px 0}
.field-block{margin-bottom:14px}
.field-block>.flabel{display:block;margin-bottom:6px}
/* SESSION VIEW */
.sv-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sv-item{border:1px solid var(--border);border-radius:7px;padding:11px 13px}
.sv-item .k{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:4px}
.sv-item .v{font-size:14px;white-space:pre-wrap}
.sv-item.full{grid-column:1 / -1}
.link-btn{background:none;border:none;padding:0;cursor:pointer;color:var(--primary);text-decoration:underline;font-size:inherit;font-family:inherit;font-weight:inherit;text-align:left}
.link-btn:hover{color:var(--primary-dk)}
/* DAY VIEW */
.cal-edit-btn{position:absolute;bottom:5px;right:5px;background:none;border:none;cursor:pointer;font-size:15px;color:var(--text);line-height:1;padding:2px 3px;border-radius:3px;opacity:0;transition:opacity .12s}
.cal-cell:hover .cal-edit-btn{opacity:1}
.cal-edit-btn:hover{background:var(--accent-lt);color:var(--primary-dk)}
.mini-cal{min-width:200px}
.mini-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mini-cal-dow{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--muted);text-align:center;padding:2px 0}
.mini-cal-cell{font-size:11px;font-weight:600;text-align:center;padding:4px 2px;border-radius:4px;cursor:pointer;color:var(--text)}
.mini-cal-cell:hover{background:var(--accent-lt)}
.mini-cal-cell.mc-out{cursor:default;pointer-events:none;color:transparent}
.mini-cal-cell.mc-green{background:var(--positive-bg);color:var(--positive)}
.mini-cal-cell.mc-yellow{background:#fef9ec;color:#92600a}
.mini-cal-cell.mc-weekend{color:var(--muted)}
.mini-cal-cell.mc-selected{outline:2px solid var(--primary);outline-offset:-1px;font-weight:800}
.dv-top{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;margin-bottom:16px}
.dv-summary{flex:1;min-width:220px}
.dv-summary .sv-item{margin-bottom:6px}
.dv-sess-card{border:1px solid var(--border);border-radius:7px;padding:11px 13px;margin-bottom:8px}
.dv-sess-card:last-child{margin-bottom:0}
.dv-sess-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.dv-sess-detail{font-size:12px;color:var(--muted)}
/* PATIENT IDENTIFIER */
.pid-cell{display:flex;align-items:center;gap:6px;white-space:nowrap}
.pid-badge{font-family:monospace;font-size:11px;letter-spacing:.3px;color:var(--muted)}
.pid-section{border:1px solid var(--border);border-radius:6px;padding:12px;background:var(--bg)}
/* PATIENT PICKER */
.patient-grid{display:flex;flex-wrap:wrap;gap:10px;padding:2px 0}
.patient-tile{background:var(--surface);border:2px solid var(--border);border-radius:8px;padding:12px 10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:96px;transition:border-color .12s,background .12s}
.patient-tile:hover{border-color:var(--accent);background:var(--bg)}
.patient-tile.selected{border-color:var(--primary);background:var(--positive-bg)}
.patient-tile-id{font-family:monospace;font-size:11px;color:var(--muted);letter-spacing:.3px}
.patient-tile-count{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--muted)}
@media print{
  #appbar,.no-print{display:none!important}
  #main{max-width:unset}
  body{min-width:unset}
  .view{display:none!important}
  .view.active{display:block!important}
}
</style>
</head>
<body>

<header id="appbar">
  <div class="bar-top">
    <div class="brand"><span class="bolt">⚡</span> Zapmaster Session Tracker <span class="who" id="brand-who"></span></div>
    <div class="bar-tools">
      <button class="tbtn" data-act="export-json">Save Data</button>
      <button class="tbtn" data-act="import-json">Load Data</button>
    </div>
  </div>
  <nav id="tabs">
    <div class="tabs-primary">
      <button data-nav="reports">Reports</button>
      <button data-nav="calendar">Calendar</button>
      <button data-nav="sessions">Sessions</button>
      <button data-nav="patients">Patients</button>
      <button data-nav="assignments">Assignments</button>
    </div>
    <div class="tabs-secondary">
      <button data-nav="settings">Settings</button>
      <button data-nav="about">About</button>
    </div>
  </nav>
</header>

<main id="main">
  <section id="view-reports" class="view"></section>
  <section id="view-calendar" class="view"></section>
  <section id="view-sessions" class="view"></section>
  <section id="view-session" class="view"></section>
  <section id="view-patients" class="view"></section>
  <section id="view-patient" class="view"></section>
  <section id="view-day" class="view"></section>
  <section id="view-assignments" class="view"></section>
  <section id="view-assignment" class="view"></section>
  <section id="view-settings" class="view"></section>
  <section id="view-about" class="view"></section>
</main>

<div id="modal-root"></div>
<input type="file" id="file-import" accept="application/json,.json" style="display:none">
<input type="file" id="file-import-csv" accept=".csv,text/csv,.tsv,text/tab-separated-values" style="display:none">

<script>
/* ============================ CONSTANTS ============================ */
const K = { settings:'zap_settings', sessions:'zap_sessions', calendar:'zap_calendar', view:'zap_view', assignments:'zap_assignments', meta:'zap_meta' };
const NAV_VIEWS = ['reports','calendar','sessions','patients','assignments','settings','about']; // matches the tab order
const DEFAULT_FORM_ID = '1FAIpQLSdAs88YbezDuxVPQptIynrqfVeMlQHNWoC8lcoFHmIXYTBrmg';
const APP_VERSION = '1.0.0'; // bump by hand on notable releases
const DATA_SCHEMA_VERSION = 1; // bump when the settings/sessions/calendar/assignments shape changes
const DASH = '<span class="cross">—</span>'; // shared empty-value placeholder

const APPT_TYPES = ['Consult','Service','Colleague','Self work'];
// App-level appointment types map to the Google Form's smaller value set on submit
const APPT_FORM_MAP = { 'Colleague':'Service' };
function apptFormValue(t){ return APPT_FORM_MAP[t]||t; }
const MODALITIES = ['Galvanic - SN','Galvanic - MN','Thermolysis - Flash','Thermolysis - Manual','Blend','Insertion practice no energy'];
// App-level modality labels map to the Google Form's actual option text on submit
// (the form has no space before SN/MN: "Galvanic -SN" / "Galvanic -MN")
const MOD_FORM_MAP = { 'Galvanic - SN':'Galvanic -SN', 'Galvanic - MN':'Galvanic -MN' };
function modFormValue(m){ return MOD_FORM_MAP[m]||m; }
const MACHINES   = ['Apilus XCell','Silhouet-tone XHD','Silhouet-tone 350','Gentronics MNG','Clareblend Essence','Clareblend Elegance','NA Consult only'];
const MEGAHERTZ  = ['6.78','13.56','27.12','MNG no megahertz','NA consult only'];
// Selecting one of these machines auto-selects its default megahertz
const MACHINE_MHZ = { 'Apilus XCell':'27.12', 'Silhouet-tone 350':'6.78' };
const FIL_MAT    = ['Insulated - Traditional (ITH/ISO Guard)','Stainless','Gold','Insulated - Blend (IBL/ISO Blend)'];
const FIL_SIZE   = ['1','2','3','4','5','6'];
const FIL_BRAND  = ['Ballet','Sterex','IBIS','Protec','Unknown','NA'];
const BODY_AREAS = ['Upper lip','Chin','Cheeks','Jawline','Sideburns','Neck (front)','Neck (back)','Eyebrows','Ears','Chest','Breast/Areola','Abdomen','Underarms','Shoulders','Upper back','Lower back','Arms','Hands','Fingers','Bikini','Buttocks','Legs (upper)','Legs (lower)','Feet','Toes'];

// Google Form entry IDs
const ENTRY = {
  patient:'1343389582', date:'168924125', apptType:'1061586759', technician:'890918643',
  subjective:'1519303300', objective:'1459603147', assessment:'789531885', plan:'605200270',
  modality:'702116306', machine:'1738958763', megahertz:'2063323894',
  filMaterial:'652269251', filSize:'1227595158', filBrand:'754563532',
  levels:'1149207424', timeSpent:'1086437070'
};

// Requirement category -> modality names that count toward it

function uid(){ return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad2(n){ return String(n).padStart(2,'0'); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function isoToParts(iso){ const [y,m,d]=String(iso).split('-').map(Number); return {y,m,d}; }
function fmtDate(iso){
  if(!iso) return '';
  // tolerate legacy/non-ISO values (e.g. CSV-imported dates saved before normalization existed)
  const s=/^\d{4}-\d{2}-\d{2}$/.test(iso)?iso:normalizeDateStr(iso);
  return /^\d{4}-\d{2}-\d{2}$/.test(s)?s.replace(/-/g,'/'):String(iso);
}
function monthLabel(iso){ const {y,m}=isoToParts(iso); return new Date(y,m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'}); }
/* ---- Appointment times: stored as UTC ISO, entered/displayed in Seattle (Pacific) ---- */
const TZ='America/Los_Angeles';
function tzParts(iso,opts){ return new Intl.DateTimeFormat('en-US',Object.assign({timeZone:TZ,hour12:false},opts)).formatToParts(new Date(iso)).reduce((a,p)=>{a[p.type]=p.value;return a;},{}); }
// offset (ms) of Pacific wall-clock relative to UTC at the given instant (local - utc)
function tzOffsetMs(date){ const p=tzParts(date,{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}); const h=p.hour==='24'?0:+p.hour; return Date.UTC(+p.year,+p.month-1,+p.day,h,+p.minute,+p.second)-date.getTime(); }
// interpret a Pacific wall-clock ('YYYY-MM-DDTHH:MM') and return the matching UTC ISO instant
function pacificWallToUTC(wall){ if(!wall) return ''; const naive=new Date(wall.length===16?wall+':00Z':wall+'Z'); let utc=new Date(naive.getTime()-tzOffsetMs(naive)); utc=new Date(naive.getTime()-tzOffsetMs(utc)); return utc.toISOString(); }
function pacificToUTC(dateISO,hhmm){ return (dateISO&&hhmm)?pacificWallToUTC(dateISO+'T'+hhmm):''; }
function isoAddDays(iso,n){ const {y,m,d}=isoToParts(iso); const dt=new Date(y,m-1,d+n); return dt.getFullYear()+'-'+pad2(dt.getMonth()+1)+'-'+pad2(dt.getDate()); }
// UTC ISO -> Pacific { date:'YYYY-MM-DD', time:'HH:MM' } for form inputs
function utcToPacific(iso){ if(!iso) return {date:'',time:''}; const p=tzParts(iso,{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); const hh=p.hour==='24'?'00':p.hour; return {date:p.year+'-'+p.month+'-'+p.day,time:hh+':'+p.minute}; }
function fmtTime(iso){ if(!iso) return ''; return new Date(iso).toLocaleTimeString('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'}); }
function fmtTimeRange(s){ const a=fmtTime(s.startTime),b=fmtTime(s.endTime); return (a&&b)?a+'–'+b:(a||b||''); }
// comparable chronological key: real start instant when known, else the service date at midnight
function sessionOrder(s){ return s.startTime||((s.date||'')+'T00:00:00.000Z'); }
function num(v){ const n=parseFloat(v); return isNaN(n)?0:n; }
function autoGrow(el){ el.style.height='auto'; el.style.height=el.scrollHeight+'px'; }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }

function fmtDur(mins){
  const h=Math.floor(mins/60), m=mins%60, out=[];
  if(h) out.push(h+'hr');
  if(m) out.push(m+' minutes');
  return out.length?out.join(' '):'0 minutes';
}

// Wong colorblind-safe palette (excludes yellow and black — hard to read on white)
const IDENTICON_COLORS=['#E69F00','#56B4E9','#009E73','#0072B2','#D55E00','#CC79A7','#2F4F4F','#5f8787'];
async function patientIdFromName(name, salt){
  const normalized=(name||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const input=normalized+(salt||'');
  if(!input) return '';
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(input));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,8);
}
function patientIdSVG(hexId, size){
  if(!hexId||hexId.length<8) return '';
  size=size||32;
  const hi=parseInt(hexId.slice(0,4),16), lo=parseInt(hexId.slice(4,8),16);
  const color=IDENTICON_COLORS[lo&7];
  // 5×5 symmetric grid: 15 unique cells (cols 0–2) mirrored to cols 3–4
  const cells=[];
  for(let col=0;col<3;col++){ cells[col]=[]; for(let row=0;row<5;row++) cells[col][row]=(hi>>(col*5+row))&1; }
  const pad=2, cs=((size-pad*2)/5);
  let rects='';
  for(let row=0;row<5;row++) for(let col=0;col<5;col++){
    const mc=col<=2?col:4-col;
    if(cells[mc][row]) rects+='<rect x="'+(pad+col*cs).toFixed(1)+'" y="'+(pad+row*cs).toFixed(1)+'" width="'+cs.toFixed(1)+'" height="'+cs.toFixed(1)+'" rx="1.5" fill="'+color+'"/>';
  }
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="border-radius:4px;background:#eef1f1;display:block;flex-shrink:0">'+rects+'</svg>';
}

function genTimeText(modalities){
  const entries=Object.entries(modalities||{}).filter(([,v])=>num(v)>0);
  const total=entries.reduce((a,[,v])=>a+num(v),0);
  if(total===0) return '';
  let text=fmtDur(total*15)+' = '+total+' procedure'+(total>1?'s':'')+' total';

/* ---- Hash routing: navigation writes the URL hash; the router renders. In-place refreshes
   (edit-save, filters) still call render fns directly. Hash is used (not ?query) so it works
   from file:// without reloading and gives browser back/forward. ---- */
function navTo(route){ // route: 'sessions' or 'session/<id>'
  const h='#/'+route;
  if(location.hash===h) router(); // same hash won't fire hashchange — run router manually
  else location.hash=h;           // otherwise the hashchange listener drives router()
}
function router(){
  const raw=(location.hash||'').replace(/^#\/?/,'');
  const slash=raw.indexOf('/');
  const seg=slash===-1?raw:raw.slice(0,slash);
  const arg=slash===-1?'':raw.slice(slash+1);
  if(seg==='session' && arg){ renderSessionView(arg); return; } // renderSessionView guards missing ids
  if(seg==='patient' && arg){ renderPatientView(arg); return; }
  if(seg==='day' && arg){ renderDayView(arg); return; }
  if(seg==='assignment' && arg){ renderAssignmentView(arg); return; }
  if(NAV_VIEWS.includes(seg)){ showView(seg); return; }
  const saved=load(K.view,'reports');                           // no/invalid hash → last-used tab
  showView(NAV_VIEWS.includes(saved)?saved:'reports');
}

function filterActive(){ const f=S.sessionFilter; return !!(f.text||f.appointmentType||f.modality||f.machine||f.soap||f.from||f.to||f.filMaterial||f.filSize||f.filBrand||f.patientId); }
const FILTER_NONE='__none__'; // sentinel: match sessions missing this value
function matchesFilter(s){
  const f=S.sessionFilter;
  const arrMatch=(val,arr)=>{ if(!val) return true; if(val===FILTER_NONE) return !(arr||[]).length; return (arr||[]).includes(val); };
  if(f.appointmentType && s.appointmentType!==f.appointmentType) return false;
  if(f.modality && !(num((s.modalities||{})[f.modality])>0)) return false;
  if(!arrMatch(f.machine,s.machines)) return false;
  if(!arrMatch(f.filMaterial,s.filamentMaterial)) return false;
  if(!arrMatch(f.filSize,s.filamentSize)) return false;
  if(!arrMatch(f.filBrand,s.filamentBrand)) return false;
  if(f.soap==='yes' && !s.soapSubmitted) return false;
  if(f.soap==='no' && (s.soapSubmitted || futureSession(s))) return false;
  if(f.from && (s.date||'')<f.from) return false;
  if(f.to && (s.date||'')>f.to) return false;
  if(f.patientId && s.patientId!==f.patientId) return false;
  if(f.text){
    const hay=[s.technician,s.levelsUsed,s.timeSpentText,s.bodyAreasNote,s.myNotes,s.subjective,s.objective,s.assessment,s.plan,
      (s.bodyAreas||[]).join(' '),(s.machines||[]).join(' '),(s.filamentBrand||[]).join(' '),(s.filamentMaterial||[]).join(' ')]
      .join(' \n ').toLowerCase();
    if(!hay.includes(f.text.toLowerCase())) return false;
  }
  return true;
}
function filterSummary(){
  const f=S.sessionFilter, parts=[];
  if(f.text) parts.push('“'+f.text+'”');
  if(f.appointmentType) parts.push('type: '+f.appointmentType);
  if(f.modality) parts.push('modality: '+f.modality);
  const showVal=v=>v===FILTER_NONE?'(missing)':v;
  if(f.machine) parts.push('machine: '+showVal(f.machine));
  if(f.filMaterial) parts.push('filament material: '+showVal(f.filMaterial));
  if(f.filSize) parts.push('filament size: '+showVal(f.filSize));
  if(f.filBrand) parts.push('filament brand: '+showVal(f.filBrand));
  if(f.soap) parts.push('SOAP '+(f.soap==='yes'?'submitted':'not submitted'));
  if(f.from) parts.push('from '+fmtDate(f.from));
  if(f.to) parts.push('to '+fmtDate(f.to));
  if(f.patientId) parts.push('patient: '+f.patientId);
  return parts.join(' · ');
}

function patientsSummary(){
  const byPid={};
  S.sessions.forEach(s=>{ if(!s.patientId) return; (byPid[s.patientId]=byPid[s.patientId]||[]).push(s); });
  return Object.entries(byPid).map(([pid,sess])=>{
    const dates=sess.map(s=>s.date).filter(Boolean).sort();
    return {
      pid, sessions:sess,
      sessionCount:sess.length,
      procedureCount:sess.reduce((n,s)=>n+sessionProcedures(s),0),
      soapNeeded:sess.filter(s=>!s.soapSubmitted && !futureSession(s)).length,
      firstDate:dates[0]||'', lastDate:dates[dates.length-1]||''
    };
  }).sort((a,b)=>(b.lastDate||'').localeCompare(a.lastDate||''));
}

// Rename a patient identifier across every session that carries it. Requires the old
// name + shared salt to re-derive and confirm the *current* pid (a typo-guard — there's
// no reverse lookup from hash to name) before computing and previewing the new hash.
function openRenamePatientModal(pid){
  const ov=openModal(
    '<div class="modal-head">Rename Patient<button class="x" data-c>&times;</button></div>'+
    '<div class="modal-body">'+
      '<div class="hint" style="text-transform:none;letter-spacing:0;margin-bottom:12px">Confirming the old name '+
      're-derives <b>'+esc(pid)+'</b> as a safety check before any sessions are changed — the app never stores '+
      'raw patient names, only the hash.</div>'+
      '<div class="frow" style="margin-bottom:8px">'+
        '<div class="fg wide"><label for="rp-old-name">Old name</label><input type="text" id="rp-old-name" placeholder="Current full name"></div>'+
        '<div class="fg wide"><label for="rp-salt">Salt / secret phrase</label>'+saltFieldHTML('rp-salt','Your shared phrase')+'</div>'+
      '</div>'+
      '<div class="frow" style="margin-bottom:8px">'+
        '<div class="fg wide"><label for="rp-new-name">New name</label><input type="text" id="rp-new-name" placeholder="New full name"></div>'+
      '</div>'+
      '<button class="btn btn-g btn-sm" id="rp-preview" type="button">Preview</button>'+
      '<div id="rp-result" style="display:none;margin-top:14px"></div>'+
    '</div>'+
    '<div class="modal-foot"><button class="btn btn-g" data-c>Cancel</button><button class="btn btn-p" id="rp-apply" disabled>Rename</button></div>'
  );
  let newId='';
  ov.querySelectorAll('[data-c]').forEach(b=>b.onclick=closeModal);
  const applyBtn=ov.querySelector('#rp-apply');
  ov.querySelector('#rp-preview').onclick=async()=>{
    const oldName=ov.querySelector('#rp-old-name').value.trim();
    const salt=ov.querySelector('#rp-salt').value;
    const newName=ov.querySelector('#rp-new-name').value.trim();
    if(!oldName||!newName){ alert('Enter both the old and new name.'); return; }
    const oldCheck=await patientIdFromName(oldName,salt);
    const computedNewId=await patientIdFromName(newName,salt);
    const result=ov.querySelector('#rp-result');
    const matches=oldCheck===pid;
    let html='';
    if(!matches){
      html+='<div class="hint" style="text-transform:none;letter-spacing:0;color:var(--danger,#b5651d)">✕ Old name + salt doesn’t match this patient’s current ID ('+esc(oldCheck||'—')+'). Double-check the name and salt.</div>';
    } else {
      html+='<div class="hint" style="text-transform:none;letter-spacing:0;color:var(--ok,#2f6f4f)">✓ Old name + salt confirmed.</div>';
    }
    html+='<div style="display:flex;align-items:center;gap:10px;margin-top:10px">'+patientIdSVG(computedNewId,40)+
      '<span class="pid-badge" style="font-size:14px">'+esc(computedNewId)+'</span></div>';
    const merging=matches && computedNewId!==pid && S.sessions.some(s=>s.patientId===computedNewId);
    if(merging){
      html+='<div class="hint" style="text-transform:none;letter-spacing:0;margin-top:8px;color:var(--warn-border,#b5651d)">⚠ This ID is already used by another patient — renaming will merge both under this ID.</div>';
    }
    if(matches && computedNewId===pid){
      html+='<div class="hint" style="text-transform:none;letter-spacing:0;margin-top:8px">New name produces the same ID — nothing to change.</div>';
    }
    result.innerHTML=html; result.style.display='block';
    newId=(matches && computedNewId!==pid)?computedNewId:'';
    applyBtn.disabled=!newId;
  };
  applyBtn.onclick=async()=>{
    if(!newId) return;
    const count=S.sessions.filter(s=>s.patientId===pid).length;
    if(!await confirmDialog('Rename patient','<p>Change the patient ID on <b>'+count+'</b> session'+(count===1?'':'s')+' from '+esc(pid)+' to <b>'+esc(newId)+'</b>?</p>','Rename')) return;
    S.sessions.forEach(s=>{ if(s.patientId===pid) s.patientId=newId; });
    persist(); closeModal(); navTo('patient/'+newId);
  };
}

  if(sfPidRemoveBtn) sfPidRemoveBtn.onclick=async()=>{
    if(await confirmDialog('Remove patient ID','<p>Remove the patient identifier from this session? This takes effect when you save.</p>','Remove')){
      pendingPatientId=''; autoFilledPidValue='';
      ov.querySelector('#sf-pid-current').innerHTML='<span style="color:var(--muted);font-style:italic">Patient ID removed — will be cleared on save.</span>';
    }
  };

  if(!id){
    ov.querySelector('#sf-type').addEventListener('change', function(){
      const isSelf=this.value==='Self work';
      if(isSelf && !pendingPatientId){
        const prev=S.sessions.filter(s=>s.appointmentType==='Self work'&&s.patientId)
          .sort((a,b)=>sessionOrder(b).localeCompare(sessionOrder(a)))[0];
        if(prev&&prev.patientId){
          pendingPatientId=prev.patientId; autoFilledPidValue=prev.patientId;
          const result=ov.querySelector('#sf-pid-result');

          result.style.display='flex';
        }
      } else if(!isSelf && autoFilledPidValue && pendingPatientId===autoFilledPidValue){
        pendingPatientId=''; autoFilledPidValue='';
        const result=ov.querySelector('#sf-pid-result');
        result.innerHTML=''; result.style.display='none';

  const scope=ov.querySelector('#session-form');
  scope.querySelectorAll('textarea.autogrow').forEach(ta=>{ autoGrow(ta); ta.addEventListener('input',()=>autoGrow(ta)); });
  const readMods=()=>{ const m={}; MODALITIES.forEach((name,i)=>{ const val=num(ov.querySelector('#mod_'+i).value); if(val>0) m[name]=val; }); return m; };
  const updateTotal=()=>{ ov.querySelector('#sf-total').textContent=Object.values(readMods()).reduce((a,v)=>a+v,0); };
  scope.querySelectorAll('[data-modidx]').forEach(inp=>inp.addEventListener('input',updateTotal));
  updateTotal();
  ov.querySelector('#sf-regen').onclick=()=>{ ov.querySelector('#sf-time').value=genTimeText(readMods()); };
  // auto-select default megahertz when a mapped machine is checked
  scope.querySelectorAll('[data-group="machines"]').forEach(cb=>cb.addEventListener('change',()=>{

  }));
  ov.querySelectorAll('[data-c]').forEach(b=>b.onclick=closeModal);

  ov.querySelector('#sf-save').onclick=()=>{
    const date=ov.querySelector('#sf-date').value;
    if(!date){ alert('Date is required.'); ov.querySelector('#sf-date').focus(); return; }
    const startTime=pacificToUTC(date,ov.querySelector('#sf-start').value);
    let endTime=pacificToUTC(date,ov.querySelector('#sf-end').value);
    if(startTime&&endTime&&endTime<startTime) endTime=pacificToUTC(isoAddDays(date,1),ov.querySelector('#sf-end').value); // end past midnight
    const rec={
      id: s.id||uid(),
      date, startTime, endTime, appointmentType:ov.querySelector('#sf-type').value,
      technician:ov.querySelector('#sf-tech').value.trim(),
      soapSubmitted:ov.querySelector('#sf-soap').checked,
      modalities:readMods(),
      timeSpentText:ov.querySelector('#sf-time').value,
      machines:readGroup(scope,'machines'), megahertz:readGroup(scope,'megahertz'),
      filamentMaterial:readGroup(scope,'filamentMaterial'), filamentSize:readGroup(scope,'filamentSize'),
      filamentBrand:readGroup(scope,'filamentBrand'),
      levelsUsed:ov.querySelector('#sf-levels').value,
      bodyAreas:readGroup(scope,'bodyAreas'), bodyAreasNote:ov.querySelector('#sf-areanote').value,
      subjective:ov.querySelector('#sf-s').value, objective:ov.querySelector('#sf-o').value,
      assessment:ov.querySelector('#sf-a').value, plan:ov.querySelector('#sf-p').value,
      myNotes:ov.querySelector('#sf-notes').value
    };
    if(pendingPatientId) rec.patientId=pendingPatientId;
    if(!rec.timeSpentText) rec.timeSpentText=genTimeText(rec.modalities);
    if(s.id){ const idx=S.sessions.findIndex(x=>x.id===s.id); S.sessions[idx]=rec; }
    else S.sessions.push(rec);
    persist(); closeModal();
    if(S.view==='sessions') renderSessions();
    else if(S.view==='day') renderDayView(rec.date);
    else renderSessionView(rec.id);
  };
}

/* ============================ GOOGLE FORM LINK ============================ */
function buildFormUrl(s, includeSoap){
  const p=[];
  const add=(id,val)=>{ if(val!=null && val!=='') p.push('entry.'+id+'='+encodeURIComponent(val)); };
  const addMulti=(id,arr)=>{ (arr||[]).forEach(v=>p.push('entry.'+id+'='+encodeURIComponent(v))); };
  if(s.date){ const {y,m,d}=isoToParts(s.date); p.push('entry.'+ENTRY.date+'_year='+y,'entry.'+ENTRY.date+'_month='+m,'entry.'+ENTRY.date+'_day='+d); }
  add(ENTRY.apptType,apptFormValue(s.appointmentType));
  add(ENTRY.technician,s.technician);
  if(includeSoap){ add(ENTRY.subjective,s.subjective); add(ENTRY.objective,s.objective); add(ENTRY.assessment,s.assessment); add(ENTRY.plan,s.plan); }
  addMulti(ENTRY.modality, Object.keys(s.modalities||{}).filter(k=>num(s.modalities[k])>0).map(modFormValue));
  addMulti(ENTRY.machine,s.machines); addMulti(ENTRY.megahertz,s.megahertz);
  addMulti(ENTRY.filMaterial,s.filamentMaterial); addMulti(ENTRY.filSize,s.filamentSize); addMulti(ENTRY.filBrand,s.filamentBrand);
  add(ENTRY.levels,s.levelsUsed); add(ENTRY.timeSpent,s.timeSpentText);
  if(S.settings.soapEmail) p.unshift('emailAddress='+encodeURIComponent(S.settings.soapEmail));
  const base='https://docs.google.com/forms/d/e/'+(S.settings.formId||DEFAULT_FORM_ID)+'/viewform';
  return base+'?usp=pp_url&'+p.join('&');
}
async function openFormLink(s){
  const full=buildFormUrl(s,true);
  if(full.length<=8000){ window.open(full,'_blank'); return; }
  const ok=await confirmDialog('Link too long to fully prefill',
    '<p>This session’s <b>Subjective, Objective, Assessment, and Plan</b> are too long to fit in a prefill link.</p>'+
    '<p style="margin-top:10px">The form will open prefilled with everything else. You’ll need to <b>copy those four fields into the form manually</b>.</p>',
    'Open form anyway');
  if(ok) window.open(buildFormUrl(s,false),'_blank');
}

/* ============================ CALENDAR ============================ */
function calKey(y,m,d){ return y+'-'+pad2(m)+'-'+pad2(d); }
function dayType(iso, dow, entry){
  const sh=num(entry&&entry.servedHours), ph=num(entry&&entry.plannedHours);
  const served=sh>0, planned=ph>0;
  const status=(entry&&entry.status)||'default';
  if(served&&planned&&sh<ph) return 'partial';
  if(served) return 'completed';
  if(planned) return 'planned';
  if(status==='school-out') return 'out';
  if(status==='school-in') return 'in';
  return (dow===0||dow===6)?'weekend':'school';
}
function proceduresOnDate(iso){ return S.sessions.filter(s=>s.date===iso).reduce((a,s)=>a+sessionProcedures(s),0); }
function soapNeededOnDate(iso){ return S.sessions.some(s=>s.date===iso && !s.soapSubmitted && !futureSession(s)); }

function renderCalendar(){
  const v=document.getElementById('view-calendar');
  if(!S.calMonth){
    const st=S.settings.schoolStartDate?isoToParts(S.settings.schoolStartDate):isoToParts(todayISO());
    const now=new Date();
    S.calMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    const startM = new Date(st.y, st.m-1, 1);
    if(S.calMonth<startM) S.calMonth=startM;
  }
  const y=S.calMonth.getFullYear(), m=S.calMonth.getMonth(); // m 0-based
  const first=new Date(y,m,1), startDow=first.getDay(), daysIn=new Date(y,m+1,0).getDate();
  const title=first.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const stParts=S.settings.schoolStartDate?isoToParts(S.settings.schoolStartDate):null;
  const atStart = stParts && (y<stParts.y || (y===stParts.y && m<=stParts.m-1));

  const today=todayISO();
  let cells='';
  for(let i=0;i<startDow;i++) cells+='<div class="cal-cell out"></div>';
  for(let d=1;d<=daysIn;d++){
    const iso=calKey(y,m+1,d), dow=new Date(y,m,d).getDay(), entry=S.calendar[iso]||null;
    const dt=dayType(iso,dow,entry);
    const proc=proceduresOnDate(iso);
    const planned=num(entry&&entry.plannedHours), served=num(entry&&entry.servedHours);
    let badges='';
    if(planned) badges+='<div class="cbadge">Plan: <b>'+planned+'h</b></div>';
    if(served) badges+='<div class="cbadge">Served: <b>'+served+'h</b>'+(dt==='partial'?'<span class="cwarn" title="Served hours below plan">⚠</span>':'')+'</div>';
    cells+='<div class="cal-cell dt-'+dt+(iso===today?' today':'')+'" data-day="'+iso+'"'+(entry&&entry.note?' data-note="'+esc(entry.note)+'"':'')+'>'+
      '<div class="cal-daynum-row"><div class="cal-daynum">'+d+'</div>'+
      (soapNeededOnDate(iso)?'<div class="csoap" title="SOAP note needed">🧼</div>':'')+
      '</div>'+
      '<button class="cal-edit-btn no-print" data-edit-day="'+iso+'" title="Edit day">✏</button>'+
      (entry&&entry.note?'<div class="cnote" title="'+esc(entry.note)+'"></div>':'')+
      '<div class="cal-badges">'+(proc>0?'<span class="cproc">'+proc+' proc</span>':'')+badges+'</div>'+
    '</div>';
  }

  v.innerHTML=
    '<div class="page-title">Calendar</div>'+
    '<div class="panel"><div class="pb">'+
      '<div class="cal-head">'+
        '<div class="cal-nav"><button class="btn btn-g" id="cal-prev"'+(atStart?' disabled':'')+'>← Prev</button>'+
          '<button class="btn btn-g" id="cal-today">Today</button>'+
          '<button class="btn btn-g" id="cal-next">Next →</button></div>'+
        '<div class="cal-title">'+esc(title)+'</div>'+
      '</div>'+
      '<div class="cal-grid">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>'<div class="cal-dow">'+d+'</div>').join('')+cells+'</div>'+
      '<div class="cal-legend">'+
        '<span class="leg"><span class="sw dt-school"></span>School day (M–F)</span>'+
        '<span class="leg"><span class="sw dt-weekend"></span>Non-school / weekend</span>'+
        '<span class="leg"><span class="sw dt-planned"></span>Planned — needs served hours</span>'+
        '<span class="leg"><span class="sw dt-completed"></span>Completed (served)</span>'+
        '<span class="leg"><span class="sw dt-in"></span>School in (override)</span>'+
        '<span class="leg"><span class="sw dt-out"></span>School out (override)</span>'+
        '<span class="leg"><span class="csoap">🧼</span>SOAP note needed</span>'+
      '</div>'+
    '</div></div>';

  v.querySelector('#cal-prev').onclick=()=>{ if(atStart)return; S.calMonth=new Date(y,m-1,1); renderCalendar(); };
  v.querySelector('#cal-next').onclick=()=>{ S.calMonth=new Date(y,m+1,1); renderCalendar(); };
  v.querySelector('#cal-today').onclick=()=>{ const n=new Date(); S.calMonth=new Date(n.getFullYear(),n.getMonth(),1); renderCalendar(); };
  v.querySelectorAll('[data-day]').forEach(c=>c.onclick=()=>navTo('day/'+c.dataset.day));
  v.querySelectorAll('[data-edit-day]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); openDayForm(b.dataset.editDay); });
  const grid=v.querySelector('.cal-grid');
  grid.addEventListener('mousemove',e=>{
    const cell=e.target.closest('[data-note]');
    const t=legendTip();
    if(cell){ t.textContent=cell.dataset.note; t.style.left=(e.clientX+14)+'px'; t.style.top=(e.clientY+14)+'px'; t.style.display='block'; }
    else t.style.display='none';
  });
  grid.addEventListener('mouseleave',()=>legendTip().style.display='none');
}

          [['default','Default (M–F = school)'],['school-in','School in (open)'],['school-out','School out (closed)']].map(([val,lbl])=>'<option value="'+val+'"'+(e.status===val?' selected':'')+'>'+lbl+'</option>').join('')+
        '</select></div>'+
      '</div>'+
      '<div class="field-block"><label for="d-note">Note</label><textarea id="d-note" placeholder="Events, holidays, notes…">'+esc(e.note||'')+'</textarea></div>'+
      '<hr class="section-sep">'+sessList+
    '</div>'+
    '<div class="modal-foot"><button class="btn btn-d" id="d-clear">Clear day</button><span style="flex:1"></span><button class="btn btn-g" data-c>Cancel</button><button class="btn btn-p" id="d-save">Save</button></div>'
  );
  ov.querySelectorAll('[data-c]').forEach(b=>b.onclick=closeModal);
  ov.querySelectorAll('[data-sess]').forEach(b=>b.onclick=()=>{ closeModal(); navTo('session/'+b.dataset.sess); });
  ov.querySelector('#d-clear').onclick=()=>{ delete S.calendar[iso]; persist(); closeModal(); if(S.view==='day') navTo('day/'+iso); else renderCalendar(); };
  ov.querySelector('#d-save').onclick=()=>{
    const rec={ plannedHours:num(ov.querySelector('#d-plan').value)||'', servedHours:num(ov.querySelector('#d-serv').value)||'',
      status:ov.querySelector('#d-status').value, note:ov.querySelector('#d-note').value.trim() };
    if(!rec.plannedHours && !rec.servedHours && rec.status==='default' && !rec.note) delete S.calendar[iso];
    else S.calendar[iso]=rec;
    persist(); closeModal(); if(S.view==='day') navTo('day/'+iso); else renderCalendar();
  };
}

/* ============================ DAY DETAIL ============================ */
function prevSchoolDay(iso){
  let cur=iso;
  for(let i=0;i<90;i++){
    cur=isoAddDays(cur,-1);
    const {y,m,d}=isoToParts(cur);
    const dow=new Date(y,m-1,d).getDay();
    const dt=dayType(cur,dow,S.calendar[cur]||null);
    if(dt!=='weekend'&&dt!=='out') return cur;
  }
  return null;
}
function nextSchoolDay(iso){
  let cur=iso;
  for(let i=0;i<90;i++){
    cur=isoAddDays(cur,1);
    const {y,m,d}=isoToParts(cur);
    const dow=new Date(y,m-1,d).getDay();
    const dt=dayType(cur,dow,S.calendar[cur]||null);
    if(dt!=='weekend'&&dt!=='out') return cur;
  }
  return null;
}
function buildMiniCalendar(selectedISO, viewISO){
  if(!viewISO) viewISO=selectedISO;
  const {y,m}=isoToParts(viewISO);
  const first=new Date(y,m-1,1);
  const startDow=first.getDay();
  const daysIn=new Date(y,m,0).getDate();
  const title=first.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const dows=['S','M','T','W','T','F','S'].map(x=>'<div class="mini-cal-dow">'+x+'</div>').join('');
  let cells='';
  for(let i=0;i<startDow;i++) cells+='<div class="mini-cal-cell mc-out">&nbsp;</div>';
  for(let day=1;day<=daysIn;day++){
    const dISO=calKey(y,m,day);
    const dow=new Date(y,m-1,day).getDay();
    const dt=dayType(dISO,dow,S.calendar[dISO]||null);
    const cls=['mini-cal-cell',
      (dt==='completed'||dt==='partial')?'mc-green':dt==='planned'?'mc-yellow':'',
      dt==='weekend'?'mc-weekend':'',
      dISO===selectedISO?'mc-selected':''
    ].filter(Boolean).join(' ');
    cells+='<div class="'+cls+'" data-goto="'+dISO+'">'+day+'</div>';
  }
  const trailing=42-(startDow+daysIn);
  for(let i=0;i<trailing;i++) cells+='<div class="mini-cal-cell mc-out">&nbsp;</div>';
  const prevDate=new Date(y,m-2,1);
  const prevY=prevDate.getFullYear(), prevM=prevDate.getMonth()+1;
  const stParts=S.settings.schoolStartDate?isoToParts(S.settings.schoolStartDate):null;
  const atStart=stParts&&(y<stParts.y||(y===stParts.y&&m<=stParts.m));
  const nextDate=new Date(y,m,1);
  const nextY=nextDate.getFullYear(), nextM=nextDate.getMonth()+1;
  return '<div class="mini-cal panel">'+
    '<div class="ph" style="display:flex;align-items:center;gap:4px">'+
      (atStart?'<span style="min-width:28px"></span>':'<button class="btn btn-g btn-sm" data-minical-to="'+calKey(prevY,prevM,1)+'" title="Previous month">←</button>')+
      '<span style="flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--primary-dk)">'+esc(title)+'</span>'+
      '<button class="btn btn-g btn-sm" data-minical-to="'+calKey(nextY,nextM,1)+'" title="Next month">→</button>'+
    '</div>'+
    '<div class="pb"><div class="mini-cal-grid">'+dows+cells+'</div></div></div>';
}

/* ============================ REPORTS ============================ */
// "future" = not yet finished: before the session's end time, or (no end time) dated after today
function futureSession(s){
  if(s.endTime) return Date.now() < new Date(s.endTime).getTime();
  return (s.date||'') > todayISO();
}
// stats/reports only: drops consults AND future sessions (not yet happened)
function nonConsult(){ return S.sessions.filter(s=>s.appointmentType!=='Consult' && !futureSession(s)); }
function modalityTotals(){
  const t={}; MODALITIES.forEach(m=>t[m]=0);
  nonConsult().forEach(s=>Object.entries(s.modalities||{}).forEach(([k,v])=>{ if(t[k]!=null) t[k]+=num(v); }));
  return t;
}
function procMap(field){
  const map={};
  nonConsult().forEach(s=>{ const p=sessionProcedures(s);
    (s[field]||[]).forEach(v=>{ map[v]=(map[v]||0)+p; }); });
  return map;
}

function renderReports(){
  const v=document.getElementById('view-reports');
  const req=S.settings.requirements, unt=S.settings.untracked, total=num(S.settings.totalProcedures)||400;
  const obs=num(S.settings.observationProcedures)||0;
  const mt=modalityTotals();
  const sessionDone=nonConsult().reduce((a,s)=>a+sessionProcedures(s),0);
  const untrackedTotal=num(unt.galvanic)+num(unt.flashThermolysis)+num(unt.manualThermolysis)+num(unt.blend)+num(unt.studentChoice);
  const proceduresDone=sessionDone+obs+untrackedTotal; // observation + untracked backfill count but aren't logged as sessions

  // per-category: tracked = logged sessions; done = tracked + untracked backfill
  let catTrackedSum=0, reqSum=0, scTrackedOverflow=0, scUntrackedOverflow=0;
  const catRows=Object.entries(REQ_MAP).map(([key,info])=>{
    const tracked=info.mods.reduce((a,m)=>a+(mt[m]||0),0);
    const done=tracked+num(unt[key]);
    const r=num(req[key]); reqSum+=r; catTrackedSum+=tracked;
    scTrackedOverflow+=Math.max(0,tracked-r);
    scUntrackedOverflow+=Math.max(0,done-r)-Math.max(0,tracked-r);
    const remaining=Math.max(0,r-done);
    return '<tr><td>'+esc(info.label)+'</td><td>'+r+'</td><td>'+tracked+'</td><td>'+done+'</td><td'+(remaining===0?' class="tick"':'')+'>'+(remaining===0?'✓':remaining)+'</td></tr>';
  }).join('');
  const nonCatTracked=Math.max(0,sessionDone-catTrackedSum); // logged modalities outside requirement categories (e.g. insertion practice)
  const scReq=Math.max(0,total-reqSum-obs); // observation carved out of the student-choice remainder
  const scTracked=nonCatTracked+scTrackedOverflow; // logged procedures that fulfil student choice
  const scDone=scTracked+num(unt.studentChoice)+scUntrackedOverflow; // observation excluded from student choice
  const scRem=Math.max(0,scReq-scDone);
  const grandRem=Math.max(0,total-proceduresDone);

  // pace
  const t0=todayISO();
  const remDays=Object.entries(S.calendar).filter(([iso,e])=>iso>=t0 && num(e.plannedHours)>0 && !(num(e.servedHours)>0));
  const remSchoolDays=remDays.length;
  const remPlannedHours=remDays.reduce((a,[,e])=>a+num(e.plannedHours),0);
  const lastRemIso=remDays.map(([iso])=>iso).sort().pop();
  const totalDaysRemaining=lastRemIso?Math.round((new Date(lastRemIso+'T00:00:00Z')-new Date(t0+'T00:00:00Z'))/86400000)+1:0;
  const perDay= remSchoolDays>0 ? (grandRem/remSchoolDays).toFixed(2) : '—';

  // estimated school hours performed to date: logged served hours, or planned hours for past days not yet logged
  let estPerformedHours=0;
  Object.entries(S.calendar).forEach(([iso,e])=>{
    const served=num(e.servedHours), planned=num(e.plannedHours);
    if(served>0) estPerformedHours+=served;
    else if(planned>0 && iso<t0) estPerformedHours+=planned;
  });
  const estHrsStr=fmtHrs(estPerformedHours);
  // planning gap: performed/served + future planned hours vs. the school-hours goal
  const hoursNeeded=num(S.settings.schoolHoursNeeded)||0;
  const hoursCommitted=estPerformedHours+remPlannedHours;
  const hoursToPlan=hoursNeeded>0?Math.max(0,+(hoursNeeded-hoursCommitted).toFixed(2)):0;
  const hrsPerDay=(remSchoolDays>0&&hoursNeeded>0)?+((hoursNeeded-estPerformedHours)/remSchoolDays).toFixed(1):null;

  // outstanding tracking: past planned days missing served hours, and sessions missing SOAP
  const hourDays=Object.keys(S.calendar).filter(iso=>iso<t0 && num(S.calendar[iso].plannedHours)>0 && !(num(S.calendar[iso].servedHours)>0)).sort();
  const soapNeeded=S.sessions.filter(s=>!s.soapSubmitted && !futureSession(s)).length;

  // assignments remaining: not yet submitted, earliest due date first
  const assignmentsRemaining=S.assignments.filter(a=>!a.submitted).sort((a,b)=>(a.dueDate||'9999')<(b.dueDate||'9999')?-1:1);
  const nextDueAssignment=assignmentsRemaining.find(a=>a.dueDate);

  v.innerHTML=
    '<div class="page-title">Reports</div>'+
    '<div class="dgrid">'+
      dcard('Procedures done',proceduresDone+' / '+total, (obs>0||untrackedTotal>0)?('includes '+obs+' observation'+(untrackedTotal>0?' + '+untrackedTotal+' backfilled':'')+' (untracked)'):'')+
      dcard('Procedures remaining',String(grandRem))+
      dcard('School days remaining',String(remSchoolDays)+(totalDaysRemaining>remSchoolDays?' ('+totalDaysRemaining+' days total)':''),(remSchoolDays===0?'no planned-unserved days':fmtHrs(remPlannedHours)+' planned')+' · ~'+estHrsStr+' performed',false,hrsPerDay!==null?'~'+hrsPerDay+'h/day needed to reach '+fmtHrs(hoursNeeded):(hoursNeeded>0?'no remaining school days planned':''),hrsPerDay!==null&&hrsPerDay>8)+
      dcard('Procedures needed per school day',perDay, (perDay==='—'?'no planned-unserved days':'≈ '+fmtDur(Math.round(num(perDay)*15))+'/day to finish on schedule'), remSchoolDays>0&&grandRem>remSchoolDays)+
      dcard('Assignments remaining',String(assignmentsRemaining.length), assignmentsRemaining.length?(nextDueAssignment?'next due '+fmtDate(nextDueAssignment.dueDate)+' — '+nextDueAssignment.title:'none with a due date set'):'all caught up', false,undefined,undefined,'dcard-assignments')+
    '</div>'+
    '<div class="panel"><div class="ph">Outstanding Tracking</div><div class="pb">'+
      ((hourDays.length||soapNeeded||hoursToPlan>0)
        ? (hoursToPlan>0
            ? '<div class="ot-row"><div class="ot-msg"><div class="ot-title">Plan more school hours</div>'+
              '<div class="ot-sub"><b>'+hoursToPlan+' more hours need to be planned</b> to reach '+fmtHrs(hoursNeeded)+' · '+fmtHrs(hoursCommitted)+' planned + performed</div></div>'+
              '<button class="btn btn-a btn-sm" id="ot-plan">Open calendar →</button></div>'
            : '')+
          (hourDays.length
            ? '<div class="ot-row"><div class="ot-msg"><div class="ot-title">Enter in school hours</div>'+
              '<div class="ot-sub"><b>'+hourDays.length+'</b> past school day'+(hourDays.length>1?'s':'')+' missing served hours · earliest '+esc(fmtDate(hourDays[0]))+'</div></div>'+
              '<button class="btn btn-a btn-sm" id="ot-hours">Open '+esc(monthLabel(hourDays[0]))+' →</button></div>'
            : '')+
          (soapNeeded
            ? '<div class="ot-row"><div class="ot-msg"><div class="ot-title">Submit SOAP notes</div>'+
              '<div class="ot-sub"><b>'+soapNeeded+'</b> session'+(soapNeeded>1?'s':'')+' need SOAP notes submitted</div></div>'+
              '<button class="btn btn-a btn-sm" id="ot-soap">View sessions →</button></div>'
            : '')
        : '<div class="ot-clear">✓ You’re all caught up on hours and SOAP notes.</div>')+
    '</div></div>'+
    '<div class="panel"><div class="ph">Procedures remaining by type</div><div class="pb"><div class="tbl-wrap"><table class="tbl tbl-num">'+
      '<thead><tr><th>Type</th><th>Required</th><th>Tracked</th><th>Done</th><th>Remaining</th></tr></thead><tbody>'+
      catRows+
      (obs>0?'<tr><td>Observation</td><td>'+obs+'</td><td>0</td><td>'+obs+'</td><td class="tick">✓</td></tr>':'')+
      '<tr><td>Student choice</td><td>'+scReq+'</td><td>'+scTracked+'</td><td>'+scDone+'</td><td'+(scRem===0?' class="tick"':'')+'>'+(scRem===0?'✓':scRem)+'</td></tr>'+
      '<tr class="total-row"><td>Total</td><td>'+total+'</td><td>'+sessionDone+'</td><td>'+proceduresDone+'</td><td>'+grandRem+'</td></tr>'+
      '</tbody></table></div><div class="hint" style="margin-top:8px">Galvanic combines SN + MN. “Tracked” counts only logged sessions; “Done” adds untracked backfill + observation. Observation procedures aren’t logged as sessions (always complete). “Student choice” = total − required specifics − observation; consults excluded from all counts.</div></div></div>'+
    '<div class="panel"><div class="ph">Progress over time'+
      '<div class="prop-toggle" id="prog-toggle">'+
        '<button data-mode="proc"'+(S.progMode==='proc'?' class="on"':'')+'>Procedures</button>'+
        '<button data-mode="hours"'+(S.progMode==='hours'?' class="on"':'')+'>School Hours</button>'+
      '</div></div><div class="pb"><div class="chart-wrap"><canvas id="c-progress"></canvas></div></div></div>'+
    '<div class="panel"><div class="ph">Proportions'+
      '<div class="prop-toggle" id="prop-toggle">'+
        '<button data-mode="proc"'+(S.propMode==='proc'?' class="on"':'')+'>By procedure</button>'+
        '<button data-mode="sess"'+(S.propMode==='sess'?' class="on"':'')+'>By session</button>'+
      '</div></div><div class="pb"><div class="chart-grid" id="prop-grid">'+propGridHTML()+'</div></div></div>'+
    '<div class="panel"><div class="ph">Body Parts Worked</div><div class="pb"><div class="chart-wrap" style="height:420px"><canvas id="c-bodyparts"></canvas></div></div></div>';

  // destroy previous
  destroyCharts();
  drawProgress();
  Object.keys(PROP_CHARTS).forEach(drawProp);
  drawBar('c-bodyparts', sessMap('bodyAreas'));
  const otP=v.querySelector('#ot-plan'); if(otP) otP.onclick=()=>{ const now=new Date(); S.calMonth=new Date(now.getFullYear(),now.getMonth(),1); navTo('calendar'); };
  const otH=v.querySelector('#ot-hours'); if(otH) otH.onclick=()=>{ const {y,m}=isoToParts(hourDays[0]); S.calMonth=new Date(y,m-1,1); navTo('calendar'); };
  const otS=v.querySelector('#ot-soap'); if(otS) otS.onclick=()=>{ S.sessionFilter=Object.assign(emptyFilter(),{soap:'no'}); navTo('sessions'); };
  const daCard=v.querySelector('#dcard-assignments'); if(daCard) daCard.onclick=()=>{ S.assignmentFilter=Object.assign(emptyAssignmentFilter(),{submitted:'no'}); navTo('assignments'); };
  v.querySelectorAll('#prop-toggle button').forEach(b=>b.onclick=()=>{
    const mode=b.getAttribute('data-mode');
    if(S.propMode===mode) return;
    S.propMode=mode;
    b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    // rebuild only the proportions grid (fresh canvases handle the empty-chart case); leave the progress chart alone
    Object.keys(PROP_CHARTS).forEach(id=>{ if(S.charts[id]){ try{S.charts[id].destroy();}catch(e){} delete S.charts[id]; } });
    const grid=v.querySelector('#prop-grid'); if(grid) grid.innerHTML=propGridHTML();
    Object.keys(PROP_CHARTS).forEach(drawProp);
  });
  v.querySelectorAll('#prog-toggle button').forEach(b=>b.onclick=()=>{
    const mode=b.getAttribute('data-mode');
    if(S.progMode===mode) return;
    S.progMode=mode;
    b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    if(S.charts.progress){ try{S.charts.progress.destroy();}catch(e){} delete S.charts.progress; }
    const wrap=v.querySelector('#c-progress'); if(wrap){ const c=document.createElement('canvas'); c.id='c-progress'; wrap.parentElement.replaceChild(c,wrap); }
    drawProgress();
  });
}
function propGridHTML(){
  return chartBox('Appointment type','c-appt')+
    chartBox('Modalities','c-mod')+
    chartBox('Machines','c-mach')+
    chartBox('Filaments — material','c-fil-mat')+
    chartBox('Filaments — brand','c-fil-brand')+
    chartBox('Filaments — size','c-fil-size');
}
function dcard(lbl,val,sub,warn,sub2,warn2,id){ return '<div class="dcard'+(id?' dcard-link':'')+'"'+(id?' id="'+id+'"':'')+'><div class="dcard-lbl">'+esc(lbl)+'</div><div class="dcard-val'+(warn?' warn':'')+'">'+esc(val)+'</div>'+(sub?'<div class="dcard-sub">'+esc(sub)+'</div>':'')+(sub2?'<div class="dcard-sub'+(warn2?' warn':'')+'">'+esc(sub2)+'</div>':'')+'</div>'; }
function chartBox(title,id){ return '<div class="chart-box"><div class="chart-title">'+esc(title)+'</div><div class="chart-wrap"><canvas id="'+id+'"></canvas></div></div>'; }
// per-proportion-chart data builders for each mode; 'proc' weights by procedure count, 'sess' counts sessions
const PROP_CHARTS={
  'c-appt':     { proc:()=>apptProcedures(),                     sess:()=>apptSessions() },
  'c-mod':      { proc:()=>modalityTotals(),                     sess:()=>modalitySessions(), colorer:lbl=>modFill(lbl) },
  'c-mach':     { proc:()=>procMap('machines'),                  sess:()=>sessMap('machines') },
  'c-fil-mat':  { proc:()=>shortMat(procMap('filamentMaterial')),sess:()=>shortMat(sessMap('filamentMaterial')) },
  'c-fil-brand':{ proc:()=>procMap('filamentBrand'),             sess:()=>sessMap('filamentBrand') },
  'c-fil-size': { proc:()=>procMap('filamentSize'),              sess:()=>sessMap('filamentSize') }
};
function drawProp(id){
  const cfg=PROP_CHARTS[id]; if(!cfg) return;
  const mode=S.propMode||'proc';
  drawDoughnut(id, mode==='proc'?cfg.proc():cfg.sess(), cfg.colorer, mode==='proc'?'procedure':'session');
}
function apptProcedures(){ const m={}; nonConsult().forEach(s=>{ const t=s.appointmentType||'Unspecified'; m[t]=(m[t]||0)+sessionProcedures(s); }); return m; }
function apptSessions(){ const m={}; S.sessions.filter(s=>!futureSession(s)).forEach(s=>{ const t=s.appointmentType||'Unspecified'; m[t]=(m[t]||0)+1; }); return m; }
function sessMap(field){ const map={}; nonConsult().forEach(s=>(s[field]||[]).forEach(v=>{ map[v]=(map[v]||0)+1; })); return map; }
function modalitySessions(){ const t={}; nonConsult().forEach(s=>Object.entries(s.modalities||{}).forEach(([k,v])=>{ if(num(v)>0) t[k]=(t[k]||0)+1; })); return t; }
function shortMat(map){ const o={}; Object.entries(map).forEach(([k,v])=>{ o[MAT_SHORT[k]||k]=v; }); return o; }
function schoolDays(){ return Object.entries(S.calendar).filter(([,v])=>num(v.plannedHours)>0).sort(([a],[b])=>a.localeCompare(b)); }
function schoolDaysThrough(dateStr){ return schoolDays().filter(([d])=>d<=dateStr).length; }
function totalPlannedHours(){ return schoolDays().reduce((a,[,v])=>a+num(v.plannedHours),0); }

function drawProgress(){
  const ctx=document.getElementById('c-progress'); if(!ctx) return;
  const mode=S.progMode||'proc';
  if(mode==='hours'){
    const days=schoolDays(), totalH=totalPlannedHours(), n=days.length;
    const labels=[], actual=[], planned=[], pace=[];
    let cumH=0, cumP=0;
    days.forEach(([d,v],i)=>{
      cumH+=num(v.servedHours);
      cumP+=num(v.plannedHours);
      labels.push(fmtDate(d));
      actual.push(cumH);
      planned.push(cumP);
      pace.push(n>0?+(((i+1)*totalH/n).toFixed(2)):0);
    });
    const datasets=[
      { label:'Planned hours', data:planned, borderColor:'rgba(100,120,180,.5)', backgroundColor:'rgba(100,120,180,.12)', fill:true, tension:.2, pointRadius:0 },
      { label:'Served hours', data:actual, borderColor:'#2F4F4F', backgroundColor:'rgba(95,135,135,.25)', fill:true, tension:.2, pointRadius:3 }
    ];
    if(n>0){
      datasets.push({ label:'Even pace', data:pace, borderColor:'#999', borderDash:[4,4], pointRadius:0, fill:false });
      datasets.push({ label:'Goal ('+totalH+'h)', data:labels.map(()=>totalH), borderColor:'#dcaa4b', borderDash:[6,5], pointRadius:0, fill:false });
    }
    S.charts.progress=new Chart(ctx,{ type:'line', data:{ labels, datasets }, options:{ responsive:true, maintainAspectRatio:false, scales:{ y:{ beginAtZero:true } } } });
  } else {
    const items=nonConsult().filter(s=>s.date).slice().sort((a,b)=>a.date.localeCompare(b.date));
    const u=S.settings.untracked||{};
    let cum=(num(S.settings.observationProcedures)||0)+num(u.galvanic)+num(u.flashThermolysis)+num(u.manualThermolysis)+num(u.blend)+num(u.studentChoice);
    const labels=[], data=[], pace=[];
    const total=num(S.settings.totalProcedures)||400, n=schoolDays().length;
    items.forEach(s=>{
      cum+=sessionProcedures(s);
      labels.push(fmtDate(s.date));
      data.push(cum);
      pace.push(n>0?+(schoolDaysThrough(s.date)*total/n).toFixed(2):0);
    });
    const datasets=[{ label:'Cumulative procedures', data, borderColor:'#2F4F4F', backgroundColor:'rgba(95,135,135,.18)', fill:true, tension:.2, pointRadius:3 }];
    if(n>0) datasets.push({ label:'Even pace', data:pace, borderColor:'#999', borderDash:[4,4], pointRadius:0, fill:false });
    datasets.push({ label:'Goal ('+total+')', data:labels.map(()=>total), borderColor:'#dcaa4b', borderDash:[6,5], pointRadius:0, fill:false });
    S.charts.progress=new Chart(ctx,{ type:'line', data:{ labels, datasets }, options:{ responsive:true, maintainAspectRatio:false, scales:{ y:{ beginAtZero:true } } } });
  }
}
function legendTip(){ let t=document.getElementById('legend-tip');
  if(!t){ t=document.createElement('div'); t.id='legend-tip'; document.body.appendChild(t); }
  return t; }
function drawDoughnut(id, map, colorer, unit){
  const ctx=document.getElementById(id); if(!ctx) return;
  const ent=Object.entries(map).filter(([,v])=>v>0);
  const labels=ent.map(e=>e[0]), data=ent.map(e=>e[1]);
  if(!labels.length){ const p=ctx.parentElement; p.innerHTML='<div class="empty">No data yet</div>'; return; }
  const u=unit||'procedure';
  const bg=labels.map((l,i)=>colorer?colorer(l,i):CHART_COLORS[i%CHART_COLORS.length]);
  S.charts[id]=new Chart(ctx,{ type:'doughnut',
    data:{ labels, datasets:[{ data, backgroundColor:bg, borderWidth:1, borderColor:'#fff' }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'right', labels:{ boxWidth:12, font:{size:11} },
      onHover:(e,item,legend)=>{
        const val=legend.chart.data.datasets[0].data[item.index];
        const t=legendTip();
        t.textContent=val+' '+u+(val===1?'':'s');
        t.style.left=(e.native.clientX+12)+'px';
        t.style.top =(e.native.clientY+12)+'px';
        t.style.display='block';
        e.native.target.style.cursor='default';
      },
      onLeave:()=>{ legendTip().style.display='none'; } } } } });
}
function drawBar(id, map){
  const ctx=document.getElementById(id); if(!ctx) return;
  const ent=Object.entries(map).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const labels=ent.map(e=>e[0]), data=ent.map(e=>e[1]);
  if(!labels.length){ const p=ctx.parentElement; p.innerHTML='<div class="empty">No data yet</div>'; return; }
  const bg=labels.map((l,i)=>CHART_COLORS[i%CHART_COLORS.length]);
  S.charts[id]=new Chart(ctx,{ type:'bar',
    data:{ labels, datasets:[{ data, backgroundColor:bg, borderWidth:0 }] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display:false } },
      scales:{ x:{ beginAtZero:true, ticks:{ precision:0 } } } } });
}

/* ============================ ASSIGNMENTS ============================ */
function distinctCategories(){ return [...new Set(S.assignments.map(a=>a.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b)); }
function linkCell(url,label){ return url? '<a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(label||'Link')+' ↗</a>' : DASH; }
function cmpStr(a,b){ return String(a||'').localeCompare(String(b||'')); }
function cmpDateBlankLast(a,b){ if(!a&&!b) return 0; if(!a) return 1; if(!b) return -1; return a<b?-1:a>b?1:0; }
function assignmentFieldCompare(a,b,key){
  if(key==='dueDate'||key==='plannedDate'||key==='submittedDate') return cmpDateBlankLast(a[key],b[key]);
  if(key==='submitted') return (a.submitted?1:0)-(b.submitted?1:0);
  return cmpStr(a[key],b[key]);
}
const ASSIGNMENT_PRESETS = {
  'due-soon': { label:'Due soon first', cmp:(a,b)=>cmpDateBlankLast(a.dueDate,b.dueDate) },
  'unsubmitted-due': { label:'Unsubmitted first, then due date', cmp:(a,b)=>((a.submitted?1:0)-(b.submitted?1:0))||cmpDateBlankLast(a.dueDate,b.dueDate) },
  'category-due': { label:'By category, then due date', cmp:(a,b)=>cmpStr(a.category,b.category)||cmpDateBlankLast(a.dueDate,b.dueDate) },
  'recent-planned': { label:'Recently planned', cmp:(a,b)=>cmpDateBlankLast(b.plannedDate,a.plannedDate) }
};
function sortAssignments(list){
  const st=S.assignmentSort, arr=list.slice();
  if(st.preset && ASSIGNMENT_PRESETS[st.preset]) arr.sort(ASSIGNMENT_PRESETS[st.preset].cmp);
  else{ const dir=st.dir==='desc'?-1:1; arr.sort((a,b)=>assignmentFieldCompare(a,b,st.key)*dir); }
  return arr;
}
const ASSIGNMENT_COLUMNS=[
  {key:'title',label:'Title'},{key:'category',label:'Category'},{key:'dueDate',label:'Due'},
  {key:'plannedDate',label:'Planned'},{key:'submitted',label:'Submitted'}
];
function assignmentFilterActive(){ const f=S.assignmentFilter; return !!(f.text||f.category||f.submitted||f.dueFrom||f.dueTo||f.plannedFrom||f.plannedTo); }
function matchesAssignmentFilter(a){
  const f=S.assignmentFilter;
  if(f.category && a.category!==f.category) return false;
  if(f.submitted==='yes' && !a.submitted) return false;
  if(f.submitted==='no' && a.submitted) return false;
  if(f.dueFrom && (a.dueDate||'')<f.dueFrom) return false;
  if(f.dueTo && (a.dueDate||'')>f.dueTo) return false;
  if(f.plannedFrom && (a.plannedDate||'')<f.plannedFrom) return false;
  if(f.plannedTo && (a.plannedDate||'')>f.plannedTo) return false;
  if(f.text){
    const hay=[a.title,a.category,a.notes].join(' \n ').toLowerCase();
    if(!hay.includes(f.text.toLowerCase())) return false;
  }
  return true;
}
function assignmentFilterSummary(){
  const f=S.assignmentFilter, parts=[];
  if(f.text) parts.push('“'+f.text+'”');
  if(f.category) parts.push('category: '+f.category);
  if(f.submitted) parts.push(f.submitted==='yes'?'submitted':'not submitted');
  if(f.dueFrom) parts.push('due from '+fmtDate(f.dueFrom));
  if(f.dueTo) parts.push('due to '+fmtDate(f.dueTo));
  if(f.plannedFrom) parts.push('planned from '+fmtDate(f.plannedFrom));
  if(f.plannedTo) parts.push('planned to '+fmtDate(f.plannedTo));
  return parts.join(' · ');
}

  } else {

      ).join('')+

  }
  const presetOptions=Object.entries(ASSIGNMENT_PRESETS).map(([k,p])=>'<option value="'+k+'"'+(S.assignmentSort.preset===k?' selected':'')+'>'+esc(p.label)+'</option>').join('');
  v.innerHTML=datalist+'<div class="page-title">Assignments <span style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+

/* ---- CSV/TSV parsing & serialization ---- */
function parseCSV(text){
  const rows=[]; let row=[]; let field=''; let inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\r'){ /* skip */ }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field+=c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>!(r.length===1 && r[0]===''));
}
function parseTSV(text){
  return text.replace(/\r/g,'').split('\n').filter(l=>l!=='').map(l=>l.split('\t'));
}
function rowsToCSV(rows){ return rows.map(r=>r.map(cell=>{ const v=String(cell); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(',')).join('\n'); }
function rowsToTSV(rows){ return rows.map(r=>r.map(cell=>String(cell).replace(/[\t\n]/g,' ')).join('\t')).join('\n'); }
function parseBool(v){ return ['yes','true','1','y'].includes(String(v||'').trim().toLowerCase()); }
// Spreadsheet dates rarely come in as ISO — normalize M/D/YYYY, YYYY/M/D, and other
// Date-parseable strings to YYYY-MM-DD so fmtDate() and <input type=date> can read them.
function normalizeDateStr(v){
  v=(v||'').trim();
  if(!v) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  let m=v.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m) return m[3]+'-'+pad2(+m[1])+'-'+pad2(+m[2]);
  m=v.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if(m) return m[1]+'-'+pad2(+m[2])+'-'+pad2(+m[3]);
  const d=new Date(v);
  if(!isNaN(d.getTime())) return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  return v; // couldn't parse — leave as-is rather than losing the original value
}

const SESSION_CSV_COLS=['date','startTime','endTime','appointmentType','technician','procedures','patientId','modalities','machines','megahertz','filamentMaterial','filamentSize','filamentBrand','levelsUsed','bodyAreas','bodyAreasNote','timeSpentText','soapSubmitted','subjective','objective','assessment','plan','myNotes'];
const SESSION_CSV_HEADERS={ date:'Date', startTime:'Start Time', endTime:'End Time', appointmentType:'Type', technician:'Technician', procedures:'Procedures', patientId:'Patient ID', modalities:'Modalities', machines:'Machines', megahertz:'MHz', filamentMaterial:'Filament Material', filamentSize:'Filament Size', filamentBrand:'Filament Brand', levelsUsed:'Levels Used', bodyAreas:'Body Areas', bodyAreasNote:'Body Areas Note', timeSpentText:'Time Spent', soapSubmitted:'SOAP Submitted', subjective:'Subjective', objective:'Objective', assessment:'Assessment', plan:'Plan', myNotes:'My Notes' };
// 'procedures' is intentionally left unmapped here — it's a derived count (see sessionProcedures()),
// driven entirely by modalities, so it's export-only and ignored on import like any unknown column.
const SESSION_CSV_HEADER_MAP={ 'date':'date', 'start time':'startTime', 'end time':'endTime', 'type':'appointmentType', 'technician':'technician', 'patient id':'patientId', 'modalities':'modalities', 'machines':'machines', 'mhz':'megahertz', 'filament material':'filamentMaterial', 'filament size':'filamentSize', 'filament brand':'filamentBrand', 'levels used':'levelsUsed', 'body areas':'bodyAreas', 'body areas note':'bodyAreasNote', 'time spent':'timeSpentText', 'soap submitted':'soapSubmitted', 'subjective':'subjective', 'objective':'objective', 'assessment':'assessment', 'plan':'plan', 'my notes':'myNotes' };
const SESSION_CSV_DATE_FIELDS=['date'];
const SESSION_CSV_LIST_FIELDS=['machines','megahertz','filamentMaterial','filamentSize','filamentBrand','bodyAreas'];
const SESSION_DEFAULTS={ date:'', startTime:'', endTime:'', appointmentType:'Service', technician:'', patientId:'', subjective:'', objective:'', assessment:'', plan:'', modalities:{}, machines:[], megahertz:[], filamentMaterial:[], filamentSize:[], filamentBrand:[], levelsUsed:'', timeSpentText:'', soapSubmitted:false, bodyAreas:[], bodyAreasNote:'', myNotes:'' };
function sessionsToRows(){
  const rows=[SESSION_CSV_COLS.map(c=>SESSION_CSV_HEADERS[c])];
  S.sessions.slice().sort((a,b)=>sessionOrder(a).localeCompare(sessionOrder(b))).forEach(s=>{
    rows.push(SESSION_CSV_COLS.map(c=>{
      if(c==='procedures') return sessionProcedures(s);
      if(c==='modalities') return Object.entries(s.modalities||{}).filter(([,v])=>num(v)>0).map(([k,v])=>k+':'+v).join('; ');
      if(SESSION_CSV_LIST_FIELDS.includes(c)) return (s[c]||[]).join('; ');
      if(c==='soapSubmitted') return s.soapSubmitted?'yes':'no';
      return s[c]==null?'':s[c];
    }));
  });
  return rows;
}
function exportSessionsCSV(){ download('zapmaster-sessions-'+fileStamp()+'.csv', rowsToCSV(sessionsToRows()), 'text/csv'); }
function exportSessionsTSV(){ download('zapmaster-sessions-'+fileStamp()+'.tsv', rowsToTSV(sessionsToRows()), 'text/tab-separated-values'); }
// Rows only carry the fields present as columns, so updating an existing session
// doesn't blank out fields the spreadsheet simply didn't include.
function rowsToSessions(rows){
  if(!rows.length) return [];
  const headers=rows[0].map(h=>String(h||'').trim().toLowerCase());
  const fields=headers.map(h=>SESSION_CSV_HEADER_MAP[h]||null);
  return rows.slice(1).filter(r=>r.some(c=>String(c||'').trim())).map(r=>{
    const rec={};
    fields.forEach((f,i)=>{
      if(!f) return;
      const v=(r[i]||'').trim();
      if(f==='soapSubmitted') rec[f]=parseBool(v);
      else if(SESSION_CSV_DATE_FIELDS.includes(f)) rec[f]=normalizeDateStr(v);
      else if(f==='modalities'){
        const m={};
        v.split(';').forEach(pair=>{
          const [k,c]=pair.split(':').map(x=>(x||'').trim());
          if(k && c!==undefined && c!=='') m[k]=num(c);
        });
        rec[f]=m;
      }
      else if(SESSION_CSV_LIST_FIELDS.includes(f)) rec[f]=v?v.split(';').map(x=>x.trim()).filter(Boolean):[];
      else rec[f]=v;
    });
    return rec;
  }).filter(rec=>rec.date);
}
