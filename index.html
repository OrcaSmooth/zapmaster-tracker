async function importRecordsFile(config, file, format){
  const text=await file.text();
  const incoming=config.parseRows(format==='tsv'?parseTSV(text):parseCSV(text));
  if(!incoming.length){ alert(config.emptyMsg); return; }
  const existingByKey={};
  config.list().forEach(rec=>{ existingByKey[config.keyOf(rec)]=rec; });
  const conflicts=incoming.filter(r=>existingByKey[config.keyOf(r)]);
  if(!conflicts.length){
    incoming.forEach(r=>config.list().push(Object.assign({id:uid()},config.defaults,r)));
    persist(); config.render();
    alert('Imported '+incoming.length+' '+config.noun+(incoming.length>1?'s':'')+'.');
    return;
  }
  openImportConflictModal(config, incoming, existingByKey);
}
function openImportConflictModal(config, incoming, existingByKey){
  const conflictRows=incoming.filter(r=>existingByKey[config.keyOf(r)]);
  const newCount=incoming.length-conflictRows.length;
  const rowHTML=conflictRows.map(r=>{
    const key=config.keyOf(r);
    return '<div class="frow" style="align-items:center;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:8px">'+
      '<div class="fg wide" style="min-width:220px"><div style="font-weight:600">'+esc(config.describe(r))+'</div><div class="hint">Already exists</div></div>'+
      '<div class="fg" style="min-width:260px"><select data-conflict="'+esc(key)+'">'+
        '<option value="update" selected>Update existing</option>'+
        '<option value="duplicate">Add as new (duplicate)</option>'+
        '<option value="skip">Skip this row</option>'+
      '</select></div>'+
    '</div>';
  }).join('');
  const ov=openModal(
    '<div class="modal-head">Resolve '+conflictRows.length+' matching '+config.noun+(conflictRows.length>1?'s':'')+'<button class="x" data-c>&times;</button></div>'+
    '<div class="modal-body">'+
      '<p class="hint" style="margin-bottom:12px;text-transform:none;letter-spacing:0">'+newCount+' row'+(newCount!==1?'s':'')+' will be added as new. These already exist — choose what to do with each.</p>'+
      '<div style="margin-bottom:10px;display:flex;gap:8px"><button class="btn btn-g btn-sm" id="cf-all-update">Update all</button><button class="btn btn-g btn-sm" id="cf-all-dup">Duplicate all</button><button class="btn btn-g btn-sm" id="cf-all-skip">Skip all</button></div>'+
      rowHTML+
    '</div>'+
    '<div class="modal-foot"><button class="btn btn-g" data-c>Cancel</button><button class="btn btn-p" id="cf-apply">Apply</button></div>'
  );
  const selects=()=>ov.querySelectorAll('[data-conflict]');
  ov.querySelector('#cf-all-update').onclick=()=>selects().forEach(s=>s.value='update');
  ov.querySelector('#cf-all-dup').onclick=()=>selects().forEach(s=>s.value='duplicate');
  ov.querySelector('#cf-all-skip').onclick=()=>selects().forEach(s=>s.value='skip');
  ov.querySelectorAll('[data-c]').forEach(b=>b.onclick=closeModal);
  ov.querySelector('#cf-apply').onclick=()=>{
    const choices={}; selects().forEach(s=>{ choices[s.dataset.conflict]=s.value; });
    let added=0, updated=0, skipped=0;
    incoming.forEach(r=>{
      const key=config.keyOf(r);
      const existing=existingByKey[key];
      if(!existing){ config.list().push(Object.assign({id:uid()},config.defaults,r)); added++; return; }
      const choice=choices[key];
      if(choice==='update'){ Object.assign(existing,r); updated++; }
      else if(choice==='duplicate'){ config.list().push(Object.assign({id:uid()},config.defaults,r)); added++; }
      else skipped++;
    });
    persist(); closeModal();
    config.render();
    alert('Import complete — '+added+' added, '+updated+' updated, '+skipped+' skipped.');
  };
}
let pendingImportTarget=null, pendingImportFormat=null; // set by a page's Import-menu item, consumed by #file-import-csv's change handler

function applyImport(data){

  if(data.calendar&&typeof data.calendar==='object') S.calendar=data.calendar;

  persist(); refreshChrome(); S.calMonth=null;
}

document.addEventListener('click',e=>{
  const dd=e.target.closest('[data-dd]');
  const act=e.target.closest('[data-act]');
  // close any open dropdown when clicking outside a toggle or the menu itself
  if(!dd && !e.target.closest('.dd-menu')) document.querySelectorAll('.dd-menu.open').forEach(m=>m.classList.remove('open'));
  if(dd){ const menu=document.getElementById(dd.dataset.dd); if(menu){ const wasOpen=menu.classList.contains('open'); document.querySelectorAll('.dd-menu.open').forEach(m=>m.classList.remove('open')); menu.classList.toggle('open',!wasOpen); } return; }
  if(!act){
    // a click on a dd-menu item without data-act (its own onclick already ran) still needs the menu closed
    if(e.target.closest('.dd-menu')) document.querySelectorAll('.dd-menu.open').forEach(m=>m.classList.remove('open'));
    return;
  }
  const a=act.dataset.act;
  if(a==='export-json') exportJSON();
  else if(a==='import-json') importJSON();
  else if(a==='toggle-pw'){
    const inp=document.getElementById(act.dataset.pwTarget);
    if(inp){ const showing=inp.type==='text'; inp.type=showing?'password':'text'; act.textContent=showing?'Show':'Hide'; }
  }
  document.querySelectorAll('.dd-menu.open').forEach(m=>m.classList.remove('open'));
});
document.getElementById('file-import').addEventListener('change',e=>{ const f=e.target.files[0]; if(f){ const h=importHandler||handleImportFile; importHandler=null; h(f); } e.target.value=''; });
document.getElementById('file-import-csv').addEventListener('change',e=>{
  const f=e.target.files[0];
  if(f && pendingImportTarget) importRecordsFile(IMPORT_CONFIGS[pendingImportTarget], f, pendingImportFormat);
  pendingImportTarget=null; pendingImportFormat=null; e.target.value='';
});

/* ============================ INIT ============================ */
refreshChrome();
maybeOnboard();
window.addEventListener('hashchange', router);
router(); // honors an initial #/... hash, else falls back to the saved K.view tab
</script>
</body>
</html>
